name: Blender Render Farm
on:
  workflow_dispatch:
    inputs:
      blend_file:
        description: 'Path/name of the .blend file to render (e.g., custom_scene.blend):'
        required: true
        default: 'Dominos.blend'
        type: string
      start_frame:
        description: 'Frame to start rendering from'
        required: true
        default: '1'
      total_frames:
        description: 'Total number of frames in the animation'
        required: true
        default: '100'
      chunks:
        description: 'Number of parallel runners (Matrix instances)'
        required: true
        default: '8'
        type: choice
        options:
          - '2'
          - '4'
          - '8'
          - '16'
      cycles_samples:
        description: 'Cycles Render Samples (Lower = Faster)'
        required: true
        default: '32'
      max_bounces:
        description: 'Max Light Bounces (Speed vs Realism)'
        required: true
        default: '4'
      enable_denoiser:
        description: 'Enable OpenImageDenoise'
        required: true
        default: true
        type: boolean

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Calculate Parallel Matrix Chunks
        id: set-matrix
        run: |
          START=${{ github.event.inputs.start_frame }}
          TOTAL=${{ github.event.inputs.total_frames }}
          CHUNKS=${{ github.event.inputs.chunks }}
          
          # Calculate frames per chunk
          FRAMES_PER_CHUNK=$(( (TOTAL - START + 1 + CHUNKS - 1) / CHUNKS ))
          
          JSON="["
          for (( i=0; i<CHUNKS; i++ )); do
            C_START=$(( START + i * FRAMES_PER_CHUNK ))
            C_END=$(( C_START + FRAMES_PER_CHUNK - 1 ))
            if [ $C_END -gt $TOTAL ]; then
              C_END=$TOTAL
            fi
            if [ $C_START -le $TOTAL ]; then
              if [ $i -gt 0 ]; then JSON+=","; fi
              JSON+="{\"id\": $i, \"start\": $C_START, \"end\": $C_END}"
            fi
          done
          JSON+="]"
          echo "matrix=$JSON" >> $GITHUB_OUTPUT

  render-matrix:
    needs: generate-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        chunk: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Blender Engine
        uses: bradyajohnston/setup-blender@v5
        with:
          version: '5.0'

      - name: Execute Parallel Render Chunk
        run: |
          blender -b "${{ github.event.inputs.blend_file }}" -P ./render_batch.py -- \
            ${{ matrix.chunk.start }} \
            ${{ matrix.chunk.end }} \
            ${{ github.event.inputs.cycles_samples }} \
            ${{ github.event.inputs.max_bounces }} \
            ${{ github.event.inputs.enable_denoiser }}

      - name: Upload Chunk Frames Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frames-chunk-${{ matrix.chunk.id }}
          path: output/
          compression-level: 0
          retention-days: 2

  compile-video:
    needs: render-matrix
    runs-on: ubuntu-latest
    steps:
      - name: Create Workspace Directories
        run: mkdir -p all_frames final_video

      - name: Download All Chunk Artifacts
        uses: actions/upload-artifact@v4 # or download-artifact@v4
        with:
          path: all_frames/
          pattern: frames-chunk-*
          merge-multiple: true

      # ADD THIS STEP TO INSTALL FFMPEG BEFORE COMPILING
      - name: Setup FFmpeg Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Compile Video with FFmpeg
        run: ffmpeg -framerate 24 -pattern_type glob -i 'all_frames/frame_*.png' -c:v libx264 -pix_fmt yuv420p final_video/animation.mp4

      - name: Upload Final MP4 Video
        uses: actions/upload-artifact@v4
        with:
          name: final-animation-mp4
          path: final_video/animation.mp4
          compression-level: 0
