name: Optimized Blender Render Farm
on:
  workflow_dispatch:
    inputs:
      blend_file:
        description: 'Filename/path of the .blend file:'
        required: true
        default: 'Dominos.blend'
      start_frame:
        description: 'Start Frame'
        required: true
        default: '1'
      total_frames:
        description: 'Total Frames'
        required: true
        default: '100'
      frames_per_chunk:
        description: 'Frames per job (Micro-chunk size for queueing)'
        required: true
        default: '5'
      max_runners:
        description: 'Max concurrent runners (Max 20 for free tier)'
        required: true
        default: '16'
      cycles_samples:
        description: 'Cycles Samples'
        required: true
        default: '32'
      enable_denoiser:
        description: 'Use OpenImageDenoise'
        required: true
        default: 'true'
        type: boolean

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Generate Dynamic Job Queue
        id: set-matrix
        env:
          START: ${{ inputs.start_frame }}
          TOTAL: ${{ inputs.total_frames }}
          CHUNK_SIZE: ${{ inputs.frames_per_chunk }}
        run: |
          python3 -c '
          import os, json
          start = int(os.environ["START"])
          total = int(os.environ["TOTAL"])
          chunk_size = int(os.environ["CHUNK_SIZE"])
          
          chunks = []
          for i, f_start in enumerate(range(start, total + 1, chunk_size)):
              f_end = min(f_start + chunk_size - 1, total)
              chunks.append({"id": i, "start": f_start, "end": f_end})
          
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"matrix={json.dumps(chunks)}\n")
          '

  render-matrix:
    needs: generate-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJson(inputs.max_runners) }}
      matrix:
        chunk: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Blender Engine (Cached)
        uses: bradyajohnston/setup-blender@v5
        with:
          version: '5.0'

      - name: Execute Render Chunk
        run: |
          blender -b "${{ inputs.blend_file }}" --factory-startup -noaudio -P scripts/blender_batch.py -- \
            ${{ matrix.chunk.start }} \${{ matrix.chunk.end }} \
            ${{ inputs.cycles_samples }} \${{ inputs.enable_denoiser }}

      - name: Upload Frames
        uses: actions/upload-artifact@v4
        with:
          name: frames-chunk-${{ matrix.chunk.id }}
          path: output/
          compression-level: 0
          retention-days: 1

  compile-video:
    needs: render-matrix
    runs-on: ubuntu-latest
    steps:
      - name: Prepare Directories
        run: mkdir -p all_frames final_video

      - name: Download & Merge All Frames
        uses: actions/download-artifact@v4
        with:
          path: all_frames/
          pattern: frames-chunk-*
          merge-multiple: true

      - name: Fast Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Encode MP4 Video
        run: |
          ffmpeg -framerate 24 -pattern_type glob -i 'all_frames/frame_*.png' \
            -c:v libx264 -preset fast -crf 18 -pix_fmt yuv420p \
            final_video/animation.mp4

      - name: Upload Final Video
        uses: actions/upload-artifact@v4
        with:
          name: final-animation-mp4
          path: final_video/animation.mp4
          compression-level: 0
