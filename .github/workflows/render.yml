name: Public Blender Render Farm

on:
  workflow_dispatch:
    inputs:
      blend_file:
        description: 'Name of the .blend file (e.g., project.blend)'
        required: true
        default: 'project.blend'
      start_frame:
        description: 'Frame to start rendering from'
        required: true
        default: '1'
      total_frames:
        description: 'Total number of frames in the animation'
        required: true
        default: '100'

jobs:
  render-batch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
          
      - name: Setup Blender Engine
        uses: bradyajohnston/setup-blender@v5
        with:
          version: '5.0' # Keep matched to your local version

      - name: Execute 10-Frame Render
        run: |
          blender -b "${{ github.event.inputs.blend_file }}" -P ./render_batch.py -- ${{ github.event.inputs.start_frame }} ${{ github.event.inputs.total_frames }}

      - name: Upload Frames
        uses: actions/upload-artifact@v4
        with:
          name: frames-batch-${{ github.event.inputs.start_frame }}
          path: output/
          compression-level: 0 # Upload raw unzipped frames
          retention-days: 2

      - name: Chain Next Batch or Trigger Video Stitch
        run: |
          FILE="${{ github.event.inputs.blend_file }}"
          START=${{ github.event.inputs.start_frame }}
          MAX_FRAMES=${{ github.event.inputs.total_frames }}
          NEXT_START=$((START + 10))
          
          if [ $NEXT_START -le $MAX_FRAMES ]; then
            echo "Spawning next batch starting at frame $NEXT_START..."
            curl -X POST \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github.v3+json" \
              https://github.com{{ github.repository }}/actions/workflows/render.yml/dispatches \
              -d "{\"ref\":\"main\", \"inputs\":{\"blend_file\":\"$FILE\", \"start_frame\":\"$NEXT_START\", \"total_frames\":\"$MAX_FRAMES\"}}"
          else
            echo "All frames rendered! Triggering final MP4 compilation workflow..."
            # This triggers our secondary compilation event
            curl -X POST \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github.v3+json" \
              https://github.com{{ github.repository }}/actions/workflows/render.yml/dispatches \
              -d "{\"ref\":\"main\", \"inputs\":{\"blend_file\":\"$FILE\", \"start_frame\":\"stitch\", \"total_frames\":\"$MAX_FRAMES\"}}"
          fi

  compile-video:
    # This job only runs when start_frame is explicitly passed as "stitch"
    if: ${{ github.event.inputs.start_frame == 'stitch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Create Workspace Directories
        run: mkdir -p all_frames final_video

      - name: Download All Rendered Batches
        uses: actions/download-artifact@v4
        with:
          path: all_frames/
          pattern: frames-batch-*
          merge-multiple: true # Flattens all separate batches into one directory

      - name: Compile Video with FFmpeg
        run: |
          # Stitch png files into a high-quality H.264 MP4 video at 24 frames per second
          ffmpeg -framerate 24 -pattern_type glob -i 'all_frames/frame_*.png' -c:v libx264 -pix_fmt yuv420p final_video/animation.mp4

      - name: Upload Final MP4 Video
        uses: actions/upload-artifact@v4
        with:
          name: final-animation-mp4
          path: final_video/animation.mp4
          compression-level: 0 # Download the raw video directly without zipping!
