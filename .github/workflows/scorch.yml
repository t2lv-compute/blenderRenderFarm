name: Scorched Earth Storage Purge

on:
  workflow_dispatch:

jobs:
  purge-everything:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Delete All Binary Artifacts
        run: |
          echo "Hunting down all files, zips, images, and videos..."
          
          # List all artifacts, extract their IDs, and delete them cleanly via the GH CLI
          gh api repos/${{ github.repository }}/actions/artifacts --paginate -q '.artifacts[].id' | while read -r id; do
            echo "Permanently deleting artifact storage ID: $id..."
            gh api -X DELETE repos/${{ github.repository }}/actions/artifacts/$id
          done
          echo "Successfully cleared all binary artifacts!"

      - name: Clear Workflow History Logs
        run: |
          echo "Clearing out the old run logs history list..."
          
          # List all past workflow runs, skip the active run, and delete them
          gh api repos/${{ github.repository }}/actions/runs --paginate -q '.workflow_runs[] | select(.id != (${{ github.run_id }})) | .id' | while read -r run_id; do
            echo "Deleting history entry for run ID: $run_id..."
            gh api -X DELETE repos/${{ github.repository }}/actions/runs/$run_id
          done
          echo "All past run history entries successfully wiped!"
