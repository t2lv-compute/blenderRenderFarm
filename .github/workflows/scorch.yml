name: Scorched Earth Storage Purge

on:
  workflow_dispatch:

jobs:
  purge-everything:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete All Binary Artifacts
        run: |
          echo "Hunting down all files, zips, images, and videos..."
          ARTIFACTS=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://github.com{{ github.repository }}/actions/artifacts?per_page=100)
          
          IDS=$(echo "$ARTIFACTS" | jq '.artifacts[].id' 2>/dev/null || echo "")
          
          if [ -z "$IDS" ]; then
            echo "No file storage artifacts found."
          else
            for ID in $IDS; do
              echo "Permanently deleting artifact storage ID: $ID..."
              curl -s -X DELETE \
                -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                https://github.com{{ github.repository }}/actions/artifacts/$ID
            done
          fi

      - name: Clear Workflow History Logs
        run: |
          echo "Clearing out the old run logs history list..."
          RUNS=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://github.com{{ github.repository }}/actions/runs?per_page=100)
          
          # Extracts run IDs except for the current running job so it doesn't crash mid-execution
          RUN_IDS=$(echo "$RUNS" | jq --arg current_run "${{ github.run_id }}" '.workflow_runs[] | select(.id != ($current_run|tonumber)) | .id' 2>/dev/null || echo "")
          
          if [ -z "$RUN_IDS" ]; then
            echo "Workflow history log is already empty."
          else
            for RUN_ID in $RUN_IDS; do
              echo "Deleting history entry for run ID: $RUN_ID..."
              curl -s -X DELETE \
                -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                https://github.com{{ github.repository }}/actions/runs/$RUN_ID
            done
            echo "All past run history entries successfully wiped!"
          fi
